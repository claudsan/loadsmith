name: "E-Commerce Orders Flow"
baseUrl: "http://127.0.0.1:8080"

variables:
  userEmail: "dev@loadsmith.local"
  userPass: "super-secret"
  sku: "SKU-LOADSMITH-01"

steps:
  - id: health
    name: "Health Check"
    method: GET
    path: "/health"
    timeoutMs: 2000
    assert:
      status: 200
      bodyContains: "ok"
      maxDurationMs: 250

  - id: authLogin
    name: "Authenticate User"
    method: POST
    path: "/auth/login"
    headers:
      Content-Type: "application/json"
    body:
      email: "{{userEmail}}"
      password: "{{userPass}}"
    timeoutMs: 3000
    extract:
      token: "data.accessToken"
    assert:
      status: 200
      maxDurationMs: 400

  - id: createOrder
    name: "Create Order"
    method: POST
    path: "/orders"
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{token}}"
    body:
      sku: "{{sku}}"
      quantity: 2
    timeoutMs: 3000
    extract:
      orderId: "data.id"
    assert:
      status: 201
      bodyContains: "created"
      maxDurationMs: 500

  - id: getOrder
    name: "Fetch Created Order"
    method: GET
    path: "/orders/{{orderId}}"
    headers:
      Authorization: "Bearer {{token}}"
    timeoutMs: 2000
    assert:
      status: 200
      bodyContains: "{{orderId}}"
      maxDurationMs: 400

load:
  vus: 20
  rampUp: "5s"
  duration: "15s"
  thinkTimeMs: 100

thresholds:
  p95Ms: 250
  maxErrorRatePct: 1.0
