name: Release — Build Electron Binaries (Win / Linux / macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64 NSIS & Portable)
            platform_flag: --win
            artifact_name: LoadSmith-Windows-x64
          - os: ubuntu-latest
            label: Linux (x64 AppImage & deb)
            platform_flag: --linux
            artifact_name: LoadSmith-Linux-x64
          - os: macos-latest
            label: macOS (x64 & arm64 DMG/ZIP)
            platform_flag: --mac
            artifact_name: LoadSmith-macOS-Universal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: engine/go.sum

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Validate Go Engine
        working-directory: engine
        run: |
          go vet ./...
          go test ./...

      - name: Install dependencies
        run: npm --prefix apps/desktop ci

      - name: Build Go sidecar & application (TypeScript + Vite + Electron Main)
        run: |
          npm run prepare:sidecar
          npm --prefix apps/desktop run typecheck
          npm run test:desktop
          npm run build:desktop

      - name: Package Electron binaries for ${{ matrix.label }}
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never

      - name: Verify isolated packaged bundle outside monorepo
        run: npm run verify:packaged

      - name: Upload installer artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            !apps/desktop/release/*.blockmap
          if-no-files-found: error

      - name: Publish binaries to GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
